name: Assemble uv.lock
on:
  push:
    paths:
      - ".github/workflows/assemble-uv-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Generate and commit uv.lock
        run: |
          set -euo pipefail
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock unchanged"
            exit 0
          fi
          git commit -m "Add uv.lock for the locked toolchain."
          git push
